<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全台實價登錄查詢系統</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#202b3c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142d48;color:white;padding:28px max(20px,calc((100vw - 1100px)/2))}h1{font-size:26px;margin:0 0 7px}header p{margin:0;color:#d5e1ed}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.panel{background:white;border:1px solid #e1e5ed;border-radius:13px;padding:22px;margin-bottom:18px;box-shadow:0 3px 16px #15273b0b}h2{font-size:18px;margin:0 0 15px}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}input,select{width:100%;border:1px solid #cbd4df;border-radius:8px;padding:11px;font-size:15px;background:white;color:#263449}button{border:0;border-radius:8px;padding:11px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#174c78;color:white}button.secondary{background:#e8edf4;color:#28445d}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.hint{font-size:13px;color:#607085;line-height:1.7}.status{padding:10px 0;font-size:14px;color:#496176}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e7ebf0}th{background:#f1f4f8;white-space:nowrap}td{vertical-align:top}td:nth-child(5),td:nth-child(6),td:nth-child(7){white-space:nowrap}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:15px;gap:10px}.tag{display:inline-block;background:#eaf1f8;padding:3px 8px;border-radius:5px;font-size:12px}#config{display:none}#config.show{display:block}.error{color:#a32525}.muted{color:#66778b}@media(max-width:760px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:22px 18px}h1{font-size:23px}}@media(max-width:460px){.fields{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><header><h1>全台實價登錄查詢系統</h1><p>內政部實價登錄資料｜連接 Supabase 即時查詢已匯入紀錄</p></header><main class="wrap"><section class="panel" id="config"><h2>首次連線設定</h2><p class="hint">請貼上 Supabase → Project Settings → API Keys 的 <strong>Publishable key</strong>（以 sb_publishable_ 開頭）。只需設定一次，儲存在此瀏覽器。<strong>絕對不要貼上 Secret key、service_role 或資料庫密碼。</strong></p><label for="key">Publishable key</label><input id="key" type="password" autocomplete="off" placeholder="sb_publishable_..."><div class="actions"><button id="saveKey">儲存並連線</button></div><p id="keyStatus" class="hint"></p></section><section class="panel"><h2>交易資料查詢</h2><div class="fields"><div><label for="city">縣市</label><select id="city"><option value="">全部縣市</option><option value="桃園市" selected>桃園市</option><option value="臺北市">臺北市</option><option value="新北市">新北市</option><option value="臺中市">臺中市</option><option value="臺南市">臺南市</option><option value="高雄市">高雄市</option><option value="新竹市">新竹市</option><option value="新竹縣">新竹縣</option><option value="基隆市">基隆市</option><option value="宜蘭縣">宜蘭縣</option><option value="苗栗縣">苗栗縣</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option><option value="雲林縣">雲林縣</option><option value="嘉義市">嘉義市</option><option value="嘉義縣">嘉義縣</option><option value="屏東縣">屏東縣</option><option value="花蓮縣">花蓮縣</option><option value="臺東縣">臺東縣</option><option value="澎湖縣">澎湖縣</option><option value="金門縣">金門縣</option><option value="連江縣">連江縣</option></select></div><div><label for="district">行政區</label><input id="district" placeholder="例如：中壢區"></div><div><label for="keyword">建案名稱／地址</label><input id="keyword" placeholder="例如：興北二路"></div><div><label for="type">交易類型</label><select id="type"><option value="">全部類型</option><option value="買賣">買賣</option><option value="預售屋">預售屋</option><option value="租賃">租賃</option></select></div></div><div class="actions"><button id="search">查詢資料</button><button id="reset" class="secondary">清除條件</button><button id="toggleConfig" class="secondary">連線設定</button></div><p class="hint">資料範圍依後端已匯入的官方資料為準；目前先以桃園市為主，尚非全台完整資料庫。</p></section><section class="panel"><h2>查詢結果</h2><div id="status" class="status">請先完成連線設定。</div><div class="tablewrap"><table><thead><tr><th>交易日期</th><th>地區</th><th>類型</th><th>建案／地址</th><th>總價（萬元）</th><th>單價（萬／坪）</th><th>建坪</th><th>樓層</th></tr></thead><tbody id="results"></tbody></table></div><div class="pager"><button id="prev" class="secondary" disabled>上一頁</button><span id="pageInfo" class="muted">第 1 頁</span><button id="next" class="secondary" disabled>下一頁</button></div></section></main><script>
const BASE='https://ztlianilmkwbeiarowiy.supabase.co/rest/v1/';const STORAGE='real_price_publishable_key_v1';const $=id=>document.getElementById(id);let page=0,total=0;const size=50;const fields=['city','district','keyword','type'];const money=n=>n===null||n===undefined||n===''?'—':(Number(n)/10000).toLocaleString('zh-TW',{maximumFractionDigits:1});const decimal=n=>n===null||n===undefined||n===''?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});const cell=(tr,value)=>{let td=document.createElement('td');td.textContent=value??'—';tr.appendChild(td)};function showConfig(){ $('config').classList.add('show') }function safeTerm(s){return s.replace(/[*,()."\\]/g,' ').trim().replace(/\s+/g,' ')}
async function load(){const key=localStorage.getItem(STORAGE);if(!key){showConfig();$('status').textContent='請先貼上 Publishable key 並儲存。';return}const params=new URLSearchParams();params.set('select','transaction_date,transaction_date_ad,city,district,transaction_type,project_name,address,total_price,unit_price_ping,building_area_ping,floor');params.set('source','eq.MOI');params.set('order','id.desc');params.set('limit',String(size));params.set('offset',String(page*size));let city=$('city').value;if(city)params.set('city','eq.'+city);let district=safeTerm($('district').value);if(district)params.set('district','ilike.*'+district+'*');let type=$('type').value;if(type)params.set('transaction_type','eq.'+type);let kw=safeTerm($('keyword').value);if(kw)params.set('or',`(project_name.ilike.*${kw}*,address.ilike.*${kw}*)`);$('status').textContent='正在查詢資料…';$('results').replaceChildren();$('prev').disabled=true;$('next').disabled=true;try{const r=await fetch(BASE+'real_estate_transactions?'+params.toString(),{headers:{'apikey':key,'Prefer':'count=exact'}});if(!r.ok){let msg=await r.text();throw new Error('HTTP '+r.status+'：'+msg.slice(0,180))}let rows=await r.json();let range=r.headers.get('content-range')||'';let match=range.match(/\/(\d+)$/);total=match?Number(match[1]):rows.length;$('status').textContent=`找到 ${total.toLocaleString('zh-TW')} 筆符合條件的紀錄，本頁顯示 ${rows.length} 筆。`;for(const row of rows){const tr=document.createElement('tr');cell(tr,row.transaction_date_ad||row.transaction_date);cell(tr,[row.city,row.district].filter(Boolean).join(' '));cell(tr,row.transaction_type);cell(tr,[row.project_name,row.address].filter(Boolean).join('｜')||'—');cell(tr,money(row.total_price));cell(tr,money(row.unit_price_ping));cell(tr,decimal(row.building_area_ping));cell(tr,row.floor);$('results').appendChild(tr)}if(!rows.length){let tr=document.createElement('tr');let td=document.createElement('td');td.colSpan=8;td.textContent='沒有符合條件的資料。可調整條件，或確認該地區是否已匯入。';tr.appendChild(td);$('results').appendChild(tr)}$('pageInfo').textContent=`第 ${page+1} 頁 / 共 ${Math.max(1,Math.ceil(total/size))} 頁`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=total;}catch(e){$('status').textContent='查詢失敗：'+e.message;$('status').classList.add('error');showConfig()}}
$('saveKey').onclick=()=>{const v=$('key').value.trim();if(!v.startsWith('sb_publishable_')){$('keyStatus').textContent='請確認貼上的是 sb_publishable_ 開頭的 Publishable key。';return}localStorage.setItem(STORAGE,v);$('key').value='';$('keyStatus').textContent='已儲存在這個瀏覽器，正在測試連線。';$('config').classList.remove('show');page=0;load()};$('search').onclick=()=>{page=0;$('status').classList.remove('error');load()};$('reset').onclick=()=>{$('city').value='桃園市';$('district').value='';$('keyword').value='';$('type').value='';page=0;load()};$('prev').onclick=()=>{if(page>0){page--;load()}};$('next').onclick=()=>{if((page+1)*size<total){page++;load()}};$('toggleConfig').onclick=()=>{$('config').classList.toggle('show')};for(const id of ['district','keyword'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){$('search').click()}});if(localStorage.getItem(STORAGE))load();else showConfig();
</script></body></html>
